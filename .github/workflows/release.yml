name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: bloom-notch-py
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file exe
        working-directory: bloom-notch-py
        run: >
          pyinstaller --noconsole --onefile --name CrownNotch
          --icon NONE
          --add-data "README.md;."
          main.py

      - name: Smoke-run the exe (informational on headless CI)
        working-directory: bloom-notch-py
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\CrownNotch.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Host "WARNING: exe exited early on headless runner" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Install NSIS (with retries)
        shell: pwsh
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "attempt $i failed, retrying..."
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { Write-Error "choco install nsis failed after 3 attempts" }

      - name: Build Windows installer
        working-directory: bloom-notch-py
        shell: pwsh
        run: |
          $mk = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $mk) {
            foreach ($p in @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")) {
              if (Test-Path $p) { $mk = $p; break }
            }
          }
          if (-not $mk) { Write-Error "makensis not found after install" }
          & $mk.Source /V3 installer.nsi 2>&1 | Tee-Object -Variable nsisLog
          if ($LASTEXITCODE -ne 0) {
            Write-Host ($nsisLog | Select-Object -Last 40 | Out-String)
            Write-Error "makensis failed"
          }

      - name: Attach installer + portable exe to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bloom-notch-py/dist/CrownNotch-Setup.exe
            bloom-notch-py/dist/CrownNotch.exe
